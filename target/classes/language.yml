    RANDOM_FISH_EPIC:
      Name: 'Epic Fish'
      Lore:
        - ''
        - 'Very few can prove it really exists'
        - 'Sightings are rare and mostly dismissed as rumors'
        - 'It is said to be catchable only when fate converges'
        - 'Its requirements are nearly impossible, so it is almost considered fictional'

    RANDOM_FISH_LEGENDARY:
      Name: 'Legendary Fish'
      Lore:
        - ''
        - 'It exists only in ancient legends; its reality is uncertain'
        - 'For thousands of years, only vague records and incomplete illustrations remain'
        - 'Some say it went extinct long ago; others say it never existed'
        - 'If you truly catch one, you may rewrite fishing history'



    BAIT_BAG:
      Name: 'Cloud-Dream Pouch'
      Lore:
        - ''
        - 'Fish in dreams; keep bait among the clouds'
        - 'One pouch gathers the waters and clouds of both realms'
        - 'For those who wish, bait will come'
        - 'All this pouch holds comes from an old pact between angler and water'
        - ''
        - 'Stores all bait from the Fishing Enthusiast series'



    FISH_LEGENDARY_EEL_POWER:
      Name: 'Aether · Wraith Electric Eel'
      Lore:
        - ''
        - 'Can serve as a carrier of electricity'


    FISH_LURE_BASIC:
      Name: 'Basic Magic Bait'
      Lore:
        - ''
        - 'Made from insect bait and grains soaked in basic magic solution'
        - 'Emits faint magical waves that mildly attract aquatic creatures'
        - ''
        - 'Though it has no special lure field, it is every magic angler’s starting point'
        - ''
        - 'Infinite possibilities lie within the ordinary'
        - '—After all, every miracle begins with an ordinary cast'
    FISH_LURE_DUST:
      Name: 'Magic Bait · Mixed Ore Dust'
      Lore:
        - ''
        - 'Made by mixing various metal powders with basic magic bait'
        - 'When scattered into water, it emits a faint mineral resonance'
        - 'As if the song of metals deep underground had awakened'
        - ''
        - 'Legend says some metals can sense their own kind'
        - 'They swim out from rivers or glaciers, irresistibly drawn to it'
        - ''
        - 'Essential for catching “ore-dust fish”'
        - '—The living source of copper, iron, silver, and even gold'
    FISH_LURE_ORE:
      Name: 'Magic Bait · Mixed Minerals'
      Lore:
        - ''
        - 'Made by mixing various minerals with basic magic bait'
        - 'When scattered into water, it emits a faint mineral resonance'
        - 'As if the song of metals deep underground had awakened'
        - ''
        - 'Legend says some metals can sense their own kind'
        - 'They swim out from rivers or glaciers, irresistibly drawn to it'
        - ''
        - 'Essential for catching “mineral fish”'
        - '—The living source of lapis lazuli, emeralds, diamonds, and even netherite ingots'
    FISH_LURE_ALLOY_INGOT:
      Name: 'Magic Bait · Mixed Alloy Slurry'
      Lore:
        - ''
        - 'Built around molten ancient alloy, it seals the embers of the forge'
        - 'Mysterious blue patterns flow across its cooled metal surface'
        - 'It seems the echo of a hammer striking an anvil rings deep in the soul'
        - ''
        - 'Legend says that when alloy spirits sleeping in the earth'
        - 'sense this familiar rhythm of forging'
        - 'they break free from the rock and follow the sound'
        - ''
        - 'The ultimate bait for luring “high-tier alloy fish”'
        - '—Embodiments of iron, gold, netherite, and the lost civilization’s starfall steel'


    ## New bait series: Between Water and Clouds
    FISH_LURE_BETWEEN_WATER_CLOUD_CUIXIA:
      Name: 'Dawnforged Glow'
      Lore:
        - 'Take sunset by the furnace and temper ordinary iron into steel'
        - 'As the hammer rises and falls, countless metals become one'
        - 'When sparks fly, it is like “turning stone into gold”'
        - 'Ask not how much was smelted; this item was born glowing'
    FISH_LURE_BETWEEN_WATER_CLOUD_WEICHEN:
      Name: 'Fine Dust'
      Lore:
        - 'Scoop up fine sand by the stream; dust drifts like smoke between your fingers'
        - 'Wind rises, dust swirls, and ore forms'
        - 'Do not disdain its featherlight weight'
        - 'Gather enough dust, and it becomes a whole mountain'
    FISH_LURE_BETWEEN_WATER_CLOUD_RONGHUO:
      Name: 'Molten Flame'
      Lore:
        - 'Take molten fire from the furnace and turn stubborn stone into an ingot'
        - 'Where flames pass, earth and stone become iron'
        - 'Ask not its temperature; its blazing heat is its true nature'
        - 'One ingot can become countless tools'
    FISH_LURE_BETWEEN_WATER_CLOUD_YUEJIN:
      Name: 'Dancing Gold'
      Lore:
        - 'Gather the river’s shimmering light; golden waves leap across the surface'
        - 'The moon sets and the tide rises; still reflections sink like jade'
        - 'Reeling in feels like “returning with a full haul”'
        - 'No need to count carats; shimmering light itself is wealth'
    FISH_LURE_BETWEEN_WATER_CLOUD_XINGHE:
      Name: 'Star Core'
      Lore:
        - 'Take a fallen star and sink it into the abyss'
        - 'A dim glow rises from its core, burning like the newborn sun'
        - 'Do not touch it; its heat is too fierce'
        - 'Where the star core sinks, all things shine'
    FISH_LURE_BETWEEN_WATER_CLOUD_REED_JIANJIA:
      Name: 'Reeds'
      Lore:
        - ''
        - 'The reeds are lush; white dew turns to frost'
        - 'The one I seek is on the far side of the water'
        - 'Cast this bait to summon spirits from books'
    FISH_LURE_BETWEEN_WATER_CLOUD_REED_LUXUE:
      Name: 'Reed Snow'
      Lore:
        - ''
        - 'Reed fluff scatters like snow in the wind'
        - 'It lands on the water and awaits a destined fish'
        - 'One feather of white outweighs a thousand heavy baits'
    FISH_LURE_BETWEEN_WATER_CLOUD_REED_WEILU:
      Name: 'Reed Dew'
      Lore:
        - ''
        - 'Dew gathers on reed tips, cool and clear'
        - 'Gathered before sunrise, it carries the scent of wetlands'
        - 'Fish are drawn to it like sweet rain'
    FISH_LURE_BETWEEN_WATER_CLOUD_REED_BAILU:
      Name: 'White Dew'
      Lore:
        - ''
        - 'White dew falls and mist rises from the cold pool'
        - 'A thread of chill seeps to the bottom'
        - 'Fish from cold depths gather when they sense it'
    FISH_LURE_BETWEEN_WATER_CLOUD_REED_LUYA:
      Name: 'Reed Sprout'
      Lore:
        - ''
        - 'New reeds break through the water as life awakens'
        - 'Born of bamboo, carrying the spirit of the green bamboo rod'
        - 'When the tender sprout enters water, all things welcome spring'
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_NINGSHUANG:
      Name: 'Gathered Frost'
      Lore:
        - ''
        - 'Scoop up morning frost gathered thinly on the water'
        - 'Where frost passes, the water turns white'
        - 'Ask not how cold it is; once frozen, it is eternal'
        - 'A streak of frost blankets half the autumn river'
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_LUOXU:
      Name: 'Falling Fluff'
      Lore:
        - ''
        - 'Catch drifting fluff from the sky; it falls into the cold river and becomes jade'
        - 'Snow falls silently as the river flows slowly'
        - 'Though light as dust, it can tint the whole river'
        - 'The fluff sinks, and the blue water grows still'
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_BINGPO:
      Name: 'Ice Spirit'
      Lore:
        - ''
        - 'A piece of thousand-year-old ice rests on the riverbed, its spirit in the water’s heart'
        - 'When the water freezes, fish shadows pause'
        - 'Do not put it in your mouth; its chill cuts to the bone'
        - 'Where the ice spirit sinks, the river becomes a mirror'
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_CHUJI:
      Name: 'After the Storm'
      Lore:
        - ''
        - 'Borrow clear light after snowfall to disperse the river’s cold mist'
        - 'Clouds part, snow stops, and the sky clears'
        - 'Do not lament winter’s passing; clear light holds warmth'
        - 'A touch of clear sky melts snow in the deep pool'
    FISH_LURE_BETWEEN_WATER_CLOUD_HANJIANG_CHUILUN:
      Name: 'Angling'
      Lore:
        - ''
        - 'This bait evokes solitary fishing on a cold river, waiting quietly for a boat'
        - 'Snow covers the cloak; the line hangs into deep water'
        - 'Ask not what you catch; your heart is already among river and snow'
        - 'One rod, a thousand mountains in evening snow'
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_FENGSI:
      Name: 'Wind Thread'
      Lore:
        - ''
        - 'Twist a wisp of slanting wind into a thread and weave it into ripples'
        - 'The wind passes silently, yet draws ripples'
        - 'Do not seek the thread’s origin; it has no form'
        - 'Lower the wind thread, and the whole lake stirs'
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_YANYU:
      Name: 'Misty Rain'
      Lore:
        - ''
        - 'Weave misty rain into a veil over the river'
        - 'Rain taps the float; mist seals the distant sky'
        - 'Do not worry about the blurred view; truth appears in the mist'
        - 'With misty rain as your cloak, fish across Jiangnan'
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_LIANBAI:
      Name: 'Pale Ripples'
      Lore:
        - ''
        - 'A raindrop draws ripples; white light floats on the surface'
        - 'Fine slanting rain weaves patterns across the water'
        - 'Do not count the rings; each ring is a bait'
        - 'Where pale ripples pass, fish poke their heads out'
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_XIAOFENG:
      Name: 'Morning Breeze'
      Lore:
        - ''
        - 'Call a sleeve of fresh breeze at dawn to awaken last night’s rain'
        - 'The wind stops, rain clears, and dawn begins'
        - 'Do not dismiss the breeze; it carries the bait’s scent into the water'
        - 'The morning breeze passes softly as fish chase it'
    FISH_LURE_BETWEEN_WATER_CLOUD_XIYU_XIEYING:
      Name: 'Slanting Shadow'
      Lore:
        - ''
        - 'Gather a faint shadow under the rain and let it fall into the water'
        - 'Slanting wind and fine rain move shadows across the water'
        - 'Do not call shadows unreal; even illusions can lure fish'
        - 'Where the shadow sinks, hidden currents surge'
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_BAILUYU:
      Name: 'White Reed Feather'
      Lore:
        - ''
        - 'It drifts from the reeds when the wind rises'
        - 'It is not snow, but a dream breathed out by a fish'
        - ''
        - '“Tie it to your line, and the cold river will answer”'
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_HANJIANG_XUEPOZHU:
      Name: 'Snow-Spirit Pearl'
      Lore:
        - ''
        - 'Evening snow across a thousand mountains condenses into a cold spirit pearl'
        - 'Held in your palm, it still carries the frosty river wind'
        - ''
        - '“Hang this pearl on your line to summon the Slanting Wind and Fine Rain rod”'
    FISH_SPECIAL_ACTION_BETWEEN_WATER_CLOUD_XIYU_YUPIZHEN:
      Name: 'Raincloak Needle'
      Lore:
        - ''
        - 'Slanting wind combs rain into a thread of flowing light'
        - 'The needle tip still holds last night’s misty hues'
        - ''
        - '“Sink this needle to hook the wish of the ancient angler”'
    FISH_BREED_POOL:
      Name: 'Between Water and Clouds · Breeding Pool'
      Lore:
        - ''
        - 'This shallow pool raises bloodlines, not water plants'
        - 'Place two fish inside, and the pool writes the shape of their offspring'
        - ''
        - '“The young inherit their father’s scales and their mother’s bone structure, with occasional mutations”'
    FISHING_BOOK_BETWEEN_WATER_CLOUD:
      Name: 'Between Water and Clouds Fishing Guide'
      Lore:
        - ''
    FISHING_GUIDE_BETWEEN_WATER_CLOUD:
      Name: 'New Between Water and Clouds Fishing System'
      Lore:
        - ''
        - 'How to use the new Between Water and Clouds fishing system:'
        - '1. Cast and wait for the float: stillness, light nibble, then full bite'
        - '2. After a full bite, the float shakes violently and charging begins'
        - '3. Rotate the view to align the colored marker on the action-bar gauge with the center, then keep charging'
        - '4. At full charge, the rod reels in automatically and guarantees a catch; with manual reeling, more charge means a higher catch rate'
        - '5. Bait in the Cloud-Dream Pouch is consumed automatically; proficiency grows with catches and levels unlock bonuses'
    BAMBOO_JOINT:
      Name: 'Green Bamboo Segment'
      Lore:
        - ''
        - 'Take green bamboo by the stream and cut it into segments'
        - 'Each segment holds a wisp of mountain breeze'
    REED_TASSEL:
      Name: 'Reed Plume'
      Lore:
        - ''
        - 'The reeds are lush; white dew turns to frost'
        - 'The one I seek is on the far side of the water'
        - 'Wind passes over water and clouds as reed plumes sway'
        - 'This plume can be used as material for the Reed-Fluff Rod'
    MAGIC_THREAD:
      Name: 'Magic Thread'
      Lore:
        - ''
        - 'Thread spun from magic candy'
        - 'Strong yet light, able to draw spirits from between water and clouds'


    FISHING_ROD_LOG:
      Name: 'Log Fishing Rod'
      Lore:
        - ' '
        - 'Can fish various kinds of logs out of rivers'
        - 'How to use: fish in water with this rod'
        - 'Does not consume bait'


    FISHING_ROD_NEW_PLAYER:
      Name: 'Beginner Fishing Rod'
      Lore:
        - ' '
        - 'Made by wrapping a flexible willow branch with spider silk'
        - 'Light and easy to handle, a great companion for new anglers'
        - ''
        - 'When you cast your first line'
        - 'The ripples seem to say: Welcome here'
        - ''
        - '“Do not worry if you cannot catch a fish'
        - '   What matters is that you are already sitting by the water.”'

    FISHING_ROD_BETWEEN_WATER_CLOUD_CYAN_BAMBOO:
      Name: 'Between Water and Clouds · Green Bamboo Rod'
      Lore:
        - ' '
        - 'Take emerald bamboo by the stream and tie a wisp of cloud to its tip'
        - 'Hold the breeze in your rod; let the line touch autumn waters'
        - ''
        - '“Do not worry whether your creel is full'
        - '   Sitting between water and clouds, you are already part of the painting.”'

    FISHING_ROD_BETWEEN_WATER_CLOUD_REED:
      Name: 'Between Water and Clouds · Reed-Fluff Rod'
      Lore:
        - ' '
        - 'Gather reeds from the streambank, their fluff as white as fresh snow'
        - 'Tie light fluff to the rod tip; the wind becomes your hook'
        - ''
        - '“Disturb not the pond fish, only a bend of reed flowers'
        - '   When the reed flowers fall, one is as tranquil as autumn water”'
        - ''

    FISHING_ROD_BETWEEN_WATER_CLOUD_HANJIANG:
      Name: 'Between Water and Clouds · Snow on the Cold River'
      Lore:
        - ' '
        - 'Gather frozen snow from a cold river and shape it into a rod'
        - 'Hang a frosty line beneath evening snow on a thousand mountains'
        - ''
        - '“Fishing alone on the cold river, with no thought of the way home'
        - '   When snow covers the cloak, both river and mind become clear”'
        - ''

    FISHING_ROD_BETWEEN_WATER_CLOUD_XIYU:
      Name: 'Between Water and Clouds · Fine Rain · Slanting Wind'
      Lore:
        - ' '
        - 'Bend slanting wind into fishing line and weave fine rain into bait'
        - 'The rod’s shadow falls amid the misty rain'
        - ''
        - '“No need to return in slanting wind and fine rain'
        - '    One rod fishes up all the colors of mist and water”'
        - ''

    FISHING_STICK_STAR_IRON:
      Name: 'Stardust Wood'
      Lore:
        - ''
        - 'A faint light slowly flows through its grain'
        - 'As if an entire galaxy were sealed inside a branch'
        - ''
        - 'An awakened wooden core infused with Stardust Iron Dust through the “Fallen Star Ritual”'
        - 'Its resonance frequency matches the sensory range of rare aquatic creatures'
        - ''
        - 'Stardust Iron Dust glitters with brilliant blue light inside the stick'
        - '“Some fish respond only to the whispers of starlight.”'

    FISHING_ROD_WIND_SPEAKER:
      Name: 'Wind Whisperer''s Rod'
      Lore:
        - ' '
        - 'The rod is carved from spruce weathered by a thousand years of wind'
        - 'The reel is wound with threads of airflow condensed between the wings of wind spirits'
        - ''
        - 'Stand still with it, and the wind seems to whisper in your ear'
        - 'Casting is like summoning thunder; reeling in is like commanding the wind'
        - ''
        - 'Legend says only those who truly understand “waiting”'
        - 'can hear the wind reveal the fish’s paths'
        - ''
        - '“The wind never points the way'
        - '   It simply brushes past those who are ready to set off.”'

    南柯一梦终须醒_浮生若梦皆是空:
      Name: 'Entangled Cane: Thread of the End · Paradox Hook'
      Lore:
        - ' '
        - 'A piece of sugar cane from the boundary between parallel universes'
        - 'Every segment exists in a state of quantum entanglement'
        - 'One movement synchronizes all worlds'
        - ''
        - 'The fishing line is spun from the “Thread of the End”'
        - 'It leads not to the deep sea, but to the end of time'
        - ''
        - 'The hook is called “Paradox”'
        - 'because it can catch things that “never existed”'
        - ''
        - 'When the rod tip trembles—'
        - 'countless moments of “having caught it” across realities'
        - 'happen simultaneously.'
        - ''
        - '“You ask why it can catch anything?”'
        - '“Because what it catches is the act of catching itself.”'

    FISHING_ROD_FINAL_STRING:
      Name: 'Thread of the End'
      Lore:
        - ' '
        - 'It is not a thread, but the end of time'
        - 'a broken remnant of causality’s echo'
        - ''
        - 'It leads neither to the deep sea nor to the stars'
        - 'Instead, it descends into the silence “after the end”'
        - ''
        - 'When the rod tip trembles, echoes of the end of all worlds'
        - 'travel upstream along the line'
        - ''
        - 'And so—'
        - 'things not yet dead reveal their endings'
        - 'things not yet born foresee their fate'
        - ''
        - '“It does not catch fish”'
        - '“It catches the reflection of all things destined to sink.”'
    FISHING_ROD_FINAL_HOOK:
      Name: 'Paradox Hook'
      Lore:
        - ' '
        - 'This hook was never forged'
        - 'because it exists “before it was forged”'
        - ''
        - 'It is simultaneously:'
        - '  —the rusted hook of the end'
        - '  —the tip of a beginning not yet born'
        - ''
        - 'Those who observe it will see themselves'
        - 'in a future where they are casting'
        - 'and a past where something has already been caught'
        - 'happening at the same time'
        - ''
        - '“It does not break the rules”'
        - '“It simply proves that the rules are inconsistent.”'


    FISHING_ROD_FISH_ANYTHING:
      Name: 'Catch: Any Item'
      Lore:
        - ' '
        - 'This item is for reference only'
        - 'It has no practical effect'

    DOUBLE_SIDED_TAPE:
      Name: 'Double-Sided Tape'
      Lore:
        - ''
        - 'Can attach items to blocks'
        - '- Consumable'

    SCHRODINGER_FRAME_ONE:
      Name: 'Schrödinger’s Item Frame [Visible]'
      Lore:
        - ''
        - 'Does the item in the frame really exist?'
        - 'Place an item on it'
        - 'Currently supports only vanilla items without NBT'
        - 'There is a 50% chance it will disappear'
        - 'There is a 50% chance it will drop twice'
        - 'After breaking the item frame'
        - 'it may drop double the items'
        - 'or it may drop nothing'
        - 'Single-use consumable'


    SCHRODINGER_FRAME_INFINITE:
      Name: 'Schrödinger’s Item Frame [Hidden]'
      Lore:
        - ''
        - 'Does the item in the frame really exist?'
        - 'Place an item on it'
        - 'Currently supports only vanilla items without NBT'
        - 'There is a 50% chance it will disappear'
        - 'There is a 50% chance it will drop twice'
        - 'After breaking the item frame'
        - 'it may drop double the items'
        - 'or it may drop nothing'
        - 'The frame can only be broken when it contains no item'
        - 'It has only a chance to drop a normal item frame'


    ITEM_NAME_TAG:
      Name: 'Portable Name Tag'
      Lore:
        - ''
        - 'Shift + right-click to change the portable name tag’s name'
        - 'Right-click to consume the portable name tag'
        - 'Apply the name tag’s name to an item'
        - 'Can also name entities'
        - 'With a small trick, one name tag can be used to name two things'


    FISHING_BOOK:
      Name: 'Fishing Guide'
      Lore:
          - 'Introduces the preferences of different fish'
          - 'and how to catch certain special fish'

    MAGIC_CROP_INFO:
      Name: "Magic Crop Information"
      Lore:
        - ' '
        - 'Please make sure you have installed SlimeGlue'
        - 'It helps prevent your magic crop data from being lost after a restart'
        - 'Without it, magic crop Slime data will be lost when the server restarts'
        - 'Information about magic crops'
        - 'Do not use flowing water to push crops'
        - 'This will cause crops to lose their Slime data'
        - 'You can use pistons to push farmland'
        - 'to harvest magic crops efficiently'
        - 'More magic crop content and integrated production processes will be added in the future'
    

    WHEAT_SEEDS:
      Name: "Sugar-Heart Wheat Seeds(Sugar-Heart Wheat Seeds)"
      Lore:
        - 'A mutated crop that is extremely sensitive to its growing environment.'
        - ''
        - 'Features:'
        - '- Produces far more than regular wheat when mature'
        - '- A small amount of magic sugar forms at the tips of its awns'
        - '- Requires the farmland beneath it to remain intact'
        - ''
        - 'Warning:'
        - 'If the dirt below becomes air or is hit by flowing water'
        - 'the crop will immediately wither and lose all magical properties'
        - 'and become ordinary crop seeds'
        - ''
        - 'Make sure to plant it on stable farmland.'

    POTATO:
      Name: "High-Fiber Potato(High-Fiber Potato)"
      Lore:
        - 'A mutated tuber with an extensive root system and rich in magic.'
        - ''
        - 'Features:'
        - '- Produces far more than regular potatoes when mature'
        - '- High concentrations of magical fibers weave through the tuber'
        - '- Requires the farmland beneath it to remain intact'
        - ''
        - 'Warning:'
        - 'If the dirt below becomes air or is washed by flowing water'
        - 'the roots will snap instantly and lose all magical activity'
        - 'and degenerate into ordinary potato seeds'
        - ''
        - 'Make sure to plant it on stable farmland.'

    HYBRID_RICE_SEEDS:
      Name: "Hybrid Rice Seeds (Hybrid Rice)"
      Lore:
        - ' '
        - '“I once had a dream, where everyone and I'
        - ' walked through rice fields and rested in the shade beneath the rice.”'
        - '“That dream was so beautiful...”'
        - '— Yuan Longping'
        - ' '
        - '✨ These magical seeds carry the dream of resting in the shade beneath rice plants.'
        - ' '
        - 'Features:'
        - '• Very high yield: harvest large amounts of rice when mature'
        - '• Giant plants: mature rice grows tall enough to block sunlight'
        - '• Tough roots: must be planted on moist farmland'
        - ' '
        - '⚠ Note:'
        - 'If the farmland is damaged or washed by a flood,'
        - 'it will mutate into ordinary wheat seeds.'
        - ' '
        - 'Right-click to plant on moist farmland'


    ORE_DUST_CRYSTAL:
      Name: "✨ Ore Dust Crystal (Ore Dust Crystal)"
      Lore:
        - 'A rare byproduct with a low drop chance when harvesting mature magic ore-dust crops.'
        - ''
        - 'Description:'
        - '- A tiny crystal formed when magic is forcibly compressed and solidified at harvest'
        - '- Not residue from a degraded plant, but condensed essence overflowing during harvest'
        - '- Emits a faint but steady magical glow associated with its metal'
        - ''
        - 'Note:'
        - 'Appears only when perfectly mature crops are harvested under specific conditions.'

    ORE_INGOT_CRYSTAL:
      Name: "✨ Ore Ingot Crystal (Ore Ingot Crystal)"
