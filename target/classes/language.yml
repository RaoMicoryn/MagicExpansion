zh_CN:
  Items:
    QUICK_MACHINE_BV_INFO:
      Name: 'Quick Machine [Placeable] Guide'
      Lore:
        - 'Supports almost all recipes'
        - 'Vanilla recipes have been adjusted to make more sense'
        - 'The changed recipes are hidden machine easter eggs'
        - 'To reduce resource use as much as possible'
        - 'and keep the list updating smoothly'
        - 'Using Shift to move items in will not refresh the output list yet'
        - 'But using Shift to move items out will refresh the output list'
        - 'You can place the last item into the machine by hand'
        - 'or click any item in the input slot'
        - 'This will refresh the output list'
        - 'You can also click the Nether Star below'
        - 'That button will refresh the output list too'
    QUICK_ENHANCED_CRAFTING_TABLE_BV:
      Name: 'Magic Crafting Table · Enhanced [Placeable]'
      Lore:
        - 'Put the materials into the Magic Crafting Table'
        - 'The list of items you can make will show up right away'
        - 'You can craft them quickly'
    QUICK_SMELTERY_BV:
      Name: 'Magic Smeltery [Placeable]'
      Lore:
        - 'Put the materials into the Magic Smeltery'
        - 'The list of items you can make will show up right away'
        - 'You can smelt them quickly'
    QUICK_GRIND_STONE_BV:
      Name: 'Magic Grindstone [Placeable]'
