    PRE_BUILDING_TAFEI:
      Name: 'Prebuilt Statue · Sugar Factory Taffy'
      Lore:
        - 'This is a Sugar Factory Taffy building sealed inside a magical space'
        - 'Choose a peaceful spot and place it there'
        - 'Sugar Factory Taffy makes sugar here'
        - 'Taffy always faces the sunset'
    PRE_BUILDING_WISH_DALE:
      Name: 'Prebuilt Statue · Wisadel'
      Lore:
        - 'The statue still smells faintly of smoke and gunpowder, as if it was just rescued from an explosion.'
        - 'She kneels on the rubble, her shoulder cannon raised slightly, with that familiar, unsettling smile.'
        - 'They say that if you get within three meters, you can hear her whisper: “Hey, wanna see some fireworks?”'
        - 'Place the statue at the edge of a battlefield or on a high spot in your base—'
        - 'She might not protect you, but your enemies will remember that someone here is “not to be messed with.”'
    PRE_BUILDING_ANON:
      Name: 'Prebuilt Statue · Chihaya Anon'
      Lore:
        - 'A faint pink-blue glow shines on the statue, as if electricity quietly flows through her hair and skirt.'
        - 'She rises on her toes, guitar slung behind her, eyes looking into the distance, as if she is about to run toward the stage lights.'
        - 'On a quiet night, you might hear a half-finished melody softly echoing in the wind.'
        - 'Place her near your living area or watchtower—'
        - 'She may not chase away the darkness, but at least someone remembers that a dream once made people sing.'

    PRE_BUILDING_VILLAGE_LOVE_AND_TRADE_HOUSE:
      Name: 'Prebuilt Tech Build · Villager Love & Trading Hall'
      Lore:
        - 'This Villager Love & Trading Hall is sealed inside a magical space'
        - 'Choose a peaceful spot and place it there'
        - 'A combined area for villager breeding and trading'
        - 'Boats are used to keep villagers in place'
        - 'Please place boats yourself wherever needed'
        - 'The bottom-left area is for villager breeding'
        - 'The middle and right areas are two villager trading hubs'
        - 'Railways are set up around the area to move villagers'
    PRE_BUILDING_SHULKER_FARM:
      Name: 'Prebuilt Tech Build · Shulker Farm'
      Lore:
        - 'This shulker farm is sealed inside a magical space'
        - 'Place it in an open area'
        - 'Shulkers split and create lots of new shulkers here'
        - 'Please lure the shulkers yourself'
        - 'Please place the snow golem yourself'
        - 'The farm is in the center'
        - 'The collection system is underneath'
    PRE_BUILDING_MCDONALDS:
      Name: 'Prebuilt Building · McDonald’s'
      Lore:
        - 'This McDonald’s building is sealed inside a magical space'
        - 'Place it in an open area'
        - 'The building has lots of cool details'
        - 'Everyone can have their own McDonald’s'
        - 'Simple happiness from McDonald’s'
        - 'More tasty food, more surprises—all at McDonald’s'
        - 'McDonald’s makes your whole day happier'


    PRE_BUILDING_HOUSE_OAK:
      Name: 'Prebuilt House · Oak Cabin'
      Lore:
        - 'A hint of old oak scent quietly drifts from this piece of oak,'
        - 'as if telling the story of a quiet cabin sealed inside a magical space.'
        - 'It waits among the spells, ready to appear wherever its new owner chooses.'
        - 'Find a clearing in the woods and break the seal—'
        - 'The fire will burn again, and the space beneath the roof will feel like home.'
    PRE_BUILDING_HOUSE_SPRUCE:
      Name: 'Prebuilt House · Spruce Cabin'
      Lore:
        - 'The pine scent of a misty mountain peak settles into the spruce wood,'
        - 'and this spruce cabin sleeps among folded snowstorms and dawn light.'
        - 'It once stood beside a sea of clouds, listening to the pines and watching the stars drift by.'
        - 'Choose a high spot and break the seal—'
        - 'When the door opens, the mountain breeze welcomes you to your quiet retreat.'
    PRE_BUILDING_HOUSE_CHERRY:
      Name: 'Prebuilt House · Cherry Blossom Cabin'
      Lore:
        - 'A spring breeze carries pink and white petals from deep within the cherry wood,'
        - 'and this cherry blossom cabin sleeps in a gap in time, waiting for flowers to bloom.'
        - 'It once stood beside a mountain cherry grove, watching petals fall like snow and moonlight shine like silk.'
        - 'Choose a sunny hillside and say the words to break the seal—'
        - 'When the door opens, the spring breeze greets you, as if the whole season lives beneath the roof.'
    PRE_BUILDING_HOUSE_MANGROVE:
      Name: 'Prebuilt House · Mangrove Cabin'
      Lore:
        - 'Salty sea air and the whisper of tides quietly drift through the mangrove wood,'
        - 'and this mangrove cabin sleeps with the tides, its roots wrapped in moonlight and mist.'
        - 'It once stood by a quiet mangrove bay, listening to night herons and watching fireflies drift among the roots.'
        - 'Choose a muddy shore by the water and break the sea’s seal—'
        - 'When the vine door opens, the sound of waves drifts into your dreams, and you become the keeper of the tides.'
    PRE_BUILDING_HOUSE_MOSS:
      Name: 'Prebuilt House · Moss Cottage'
      Lore:
        - 'A fresh, damp earthy smell rises from the moss,'
        - 'as if the breath of the whole forest is hidden in this soft green carpet.'
        - 'This cottage sleeps beneath ancient runes, with a moss-covered roof and walls living alongside fungi.'
        - 'It once rested in the arms of an ancient tree, listening to leaves tap on its door and watching fireflies drift between the leaves.'
        - 'Find a quiet patch of forest and gently touch the voice of the earth—'
        - 'When the mossy door slowly opens, you step into a dream the forest never wants to leave.'

    PRE_BUILDING_HOUSE_WIND_CAR:
      Name: 'Prebuilt House · Windmill Cottage'
      Lore:
        - 'A gentle breeze spins out of the scroll, carrying the scent of wheat and the soft hum of turning gears,'
        - 'This windmill cottage sleeps in a frozen breeze of time, its blades still like wings yet to open.'
        - 'It once stood on rolling hills, using the wind to grind grain and light a lonely lamp through long nights.'
        - 'Choose a high, breezy spot and awaken the wind rune—'
        - 'When the blades spin again and the lights come on, the wind brings you the sound of home.'

    PRE_BUILDING_DORA_PICTURE:
      Name: 'Prebuilt Art · DORO Pixel Art'
      Lore:
        - '8-bit starlight softly flickers inside the frame,'
        - 'as if old stored data is quietly waking up.'
        - 'A goofy pink dog'



    PRE_BUILDING_WINE_BAR:
      Name: 'Prebuilt Building · Bar'
      Lore:
        - 'This is a tavern sealed inside a magical space'
        - 'Choose an open area and summon it'
        - 'Rich drinks and lovely music fill the place'
        - 'Everyone has a tavern of their own in their heart'
        - 'The tavern lights up the night and comforts travelers'
        - 'More laughter, more stories, all by the tavern firelight'
        - 'The tavern keeps you warm all night'

    PRE_BUILDING_MOON_RABBIT_SHOP:
      Name: 'Prebuilt Building · Moon Rabbit Shop'
      Lore:
        - 'This is a mysterious shop from deep inside the Moon Palace'
        - 'Choose an open spot and softly say the spell to summon it'
        - 'The shop displays rare treasures made from moonlight'
        - 'Each moon rabbit guards wishes from the human world'
        - 'On quiet nights, hear the Jade Rabbit gently grinding herbs'
        - 'More adventures and magic await at the Moon Rabbit Shop'
        - 'Where moonlight shines, wishes quietly come true'

    PRE_BUILDING_MIDDLE_HORSE_HOUSE:
      Name: 'Prebuilt Building · Medium Stable'
      Lore:
        - 'This is a medium stable sealed inside a magical space'
        - 'Choose a flat area and place it down safely'
        - 'The stable has comfy straw bedding and clean water troughs'
        - 'Every horse deserves a safe place to rest'
        - 'The soft sound of hooves is a loyal companion on the journey'
        - 'More shelter and peace of mind in the Medium Stable'
        - 'With the stable here, your companion is never far away'

    PRE_BUILDING_FISHING_PORT:
      Name: 'Prebuilt Building · Fishing Harbor'
      Lore:
        - 'This is a fishing harbor sealed inside a magical space'
        - 'Choose an open spot by the water and gently unfold it'
        - 'Small boats dock at the harbor, and buoys sway on the sparkling water'
        - 'Every angler dreams of a peaceful harbor of their own'
        - 'Cast your line in the morning mist and reel it in at sunset as time drifts by'
        - 'More catches and more peace at the Fishing Harbor'
        - 'One rod, one line, a whole world—enjoy the peace of fishing'

    PRE_BUILDING_SI_HE_YUAN:
      Name: 'Prebuilt Building · Traditional Courtyard House'
      Lore:
        - 'It is recommended to dig a foundation 4 blocks deep first'
        - 'This building has its own foundation; the main structure starts 5 blocks above the bottom'
        - 'This is a traditional courtyard house sealed inside a time box'
        - 'Choose a flat area and quietly bring it to life'
        - 'Gray roof tiles and stone paths surround flowers and fish ponds; life feels peaceful'
        - 'Every family dreams of a home filled with peace and togetherness'
        - 'The door knocker rings and cooking smoke rises—the sounds of home'
        - 'More warmth and memories await in the courtyard house'
        - 'One courtyard, one world; one family, a lifetime of seasons'

    PRE_BUILDING_BAKERY:
      Name: 'Prebuilt Building · Bakery'
      Lore:
        - 'This is a cozy bakery sealed in a cloud of sweet smells'
        - 'Choose an open corner by the street and gently open it'
        - 'The smell of fresh bread and desserts fills the shop'
        - 'Everyone has a little corner in their heart for sweets'
        - 'The oven glows softly, spreading warmth from your fingertips to your heart'
        - 'More sweet smells and happiness await at the bakery'
        - 'One warm bite can brighten your day'

    PRE_BUILDING_KFC_MIDDLE:
      Name: 'Prebuilt Building · KFC · M'
      Lore:
        - 'This is a medium KFC store sealed inside a magical space'
        - 'Choose an open area and unfold it fully'
        - 'The red-and-white sign shines softly in the breeze'
        - 'Every piece of fried chicken brings back familiar tastes and memories'
        - 'Crispy to the touch and tasty in every bite—happiness served right away'
        - 'More tasty food and good times at KFC'
        - 'One visit can make your whole day'

    PRE_BUILDING_KFC_SMALL:
      Name: 'Prebuilt Building · KFC · S'
      Lore:
        - 'This is a mini KFC store sealed inside a magical space'
        - 'Choose an open corner and place it down with ease'
        - 'Small but fully stocked, with delicious smells drifting from the window'
        - 'Even if you are just passing by, you deserve a warm treat'
        - 'A box of fried chicken and a cola can brighten an ordinary moment'
        - 'More convenience and surprises at KFC · S'
        - 'Small size, big satisfaction'

    PRE_BUILDING_LARGE_SNOW_KING:
      Name: 'Prebuilt Building · Big Snow King'
      Lore:
        - 'This is an ice castle sealed in freezing magic'
        - 'Choose a wide snowy area and let it appear'
        - 'Clear ice bricks form a dreamy fairy-tale kingdom'
        - 'Every child has an Ice King living in their heart'
        - 'Snowflakes swirl and bells ring softly as a winter wonder unfolds'
        - 'More adventures and laughter await in the world of Big Snow King'
        - 'A city of ice and snow, a fairy-tale dream'

    PRE_BUILDING_MIDDLE_VILLA:
      Name: 'Prebuilt Building · Medium Villa · α'
      Lore:
        - 'This is a medium villa · α sealed inside a magical space'
        - 'Choose a sunny hillside and quietly unfold it'
        - 'White walls, gray roofs, layered gardens, and soft light and shadows'
        - 'Everyone has a dream plan for their ideal home'
        - 'Morning light falls on the terrace, and evening breezes pass through half-open windows'
        - 'There is also a dragon egg on the table in the main living room'
        - 'More space and freedom in the Medium Villa'
        - 'A home is its own world; feeling settled brings peace'

    PRE_BUILDING_LITTLE_MI_XUE:
      Name: 'Prebuilt Building · Mixue Ice Cream & Tea · S'
      Lore:
        - 'This is a mini Mixue Ice Cream & Tea store sealed in cool magic'
        - 'Choose an open spot by the street and bring it to life'
        - 'A familiar tune plays softly in the breeze, with sweet smells all around'
        - 'Every drink brings back memories of school days'
        - 'The Snow King smiles, bubbles pop, and happiness feels simple'
        - 'More cool drinks and laughter at Mixue Ice Cream & Tea'
        - 'Sweet treats at low prices, priceless happiness'

    PRE_BUILDING_JAPAN_HOUSE:
      Name: 'Prebuilt Building · Japanese Townhouse'
      Lore:
        - 'This is a Japanese townhouse sealed inside a gentle, Japanese-style barrier'
        - 'Choose a quiet street and slowly unfold it'
        - 'Wooden lattice doors slide open, moss covers the garden, and the scent of tea fills the air'
        - 'Every townhouse holds a piece of old Kyoto'
        - 'Rain taps the eaves, wind brushes the bamboo blinds, and the mind grows calm'
        - 'More calm and peace in the Japanese townhouse'
        - 'Every corner offers a quiet moment'

    PRE_BUILDING_FARM_BARN:
      Name: 'Prebuilt Building · Farm Barn'
      Lore:
        - 'This is a farm barn sealed in the magic of a good harvest'
        - 'Choose a wide-open field and place it firmly'
        - 'Red-painted wooden walls, piles of hay, and chickens and ducks playing nearby'
        - 'Every farmer dreams of a rich and fruitful home like this'
        - 'Feed the animals before the morning dew dries, then return to the barn at sunset'
        - 'More harvests and hope at the Farm Barn'
        - 'A full barn brings peace of mind through every season'

    PRE_BUILDING_SAKURA_SHOP:
      Name: 'Prebuilt Building · Cherry Blossom Shop'
      Lore:
        - 'This is a cherry blossom shop sealed in a spring breeze barrier'
        - 'Choose an open spot beneath the flowers and gently bring it to life'
        - 'Pink and white petals swirl as the shop displays special spring items'
        - 'Everyone dreams of an unexpected date beneath the cherry blossoms'
        - 'Wind chimes ring softly, scents drift by, and time seems to pause'
        - 'More romance and surprises at the Cherry Blossom Shop'
        - 'One shop, one spring; meet when the flowers bloom'

    PRE_BUILDING_FRUIT_SHOP:
      Name: 'Prebuilt Building · Fruit Shop'
      Lore:
        - 'This is a fruit shop sealed in the magic of sunshine'
        - 'Choose an open spot by the street and open it up fresh'
        - 'Fresh fruits are piled high, giving off a natural sweetness'
        - 'Every fruit carries gifts from sunshine and rain'
        - 'Morning dew still rests on the leaves as fresh sweetness blooms on your tongue'
        - 'More freshness and energy at the Fruit Shop'
        - 'One fruity bite can brighten your day'

    PRE_BUILDING_KRUSTY_KRAB:
      Name: 'Prebuilt Building · Krusty Krab'
      Lore:
        - 'This is a Krusty Krab restaurant sealed inside an underwater barrier'
        - 'Choose a wide-open spot and bring it in with a bang'
        - 'A red roof, sizzling fryers, and the smell of Krabby Patties everywhere'
        - 'Every sea creature goes crazy for this tasty bite'
        - 'SpongeBob is grilling patties while Squidward blows gloomy bubbles'
        - 'More tasty food, more fun—that is what the Krusty Krab is all about'
        - 'Today’s menu: lots of happiness, with a side of fun'







