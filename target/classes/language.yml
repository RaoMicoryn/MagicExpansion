      Lore:
        - 'Put the materials into the Magic Pressure Press'
        - 'The list of items you can make will show up right away'
        - 'You can compress them quickly'
    QUICK_MAGIC_WORKBENCH_BV:
      Name: 'Magic Workbench [Placeable]'
      Lore:
        - 'Put the materials into the Magic Workbench'
        - 'The list of items you can make will show up right away'
        - 'You can craft them quickly'
    QUICK_AUTOMATED_PANNING_MACHINE_BV:
      Name: 'Magic Panning Machine [Placeable]'
      Lore:
        - 'Put the materials into the Magic Panning Machine'
        - 'The list of items you can make will show up right away'
        - 'You can pan for gold quickly'
    QUICK_AUTOMATED_ANCIENT_ALTAR_BV:
      Name: 'Magic Ancient Altar [Placeable]'
      Lore:
        - 'Put the materials into the Magic Ancient Altar'
        - 'The list of items you can make will show up right away'
        - 'You can craft them quickly'
    QUICK_ELECTRIC_ORE_GRINDER_BV:
      Name: 'Broken Magic Ore Grinder [Placeable]'
      Lore:
        - 'Put the materials into the Broken Magic Ore Grinder'
        - 'The list of items you can make will show up right away'
        - 'You can craft them quickly'
        - 'Currently supports: iron ore, gold ore, netherrack, sifted ore, crushed ore, pure ore clusters, and coal'
    QUICK_HEATED_PRESSURE_CHAMBER_BV:
      Name: 'Magic Pressure Chamber [Placeable]'
      Lore:
        - 'Put the materials into the Magic Pressure Chamber'
        - 'The list of items you can make will show up right away'
        - 'You can craft them quickly'
    ENCHANTING_TABLE:
      Name: 'Magic Enchanting Table'
      Lore:
        - 'A separate set of bonus stats'
        - 'Uses upgrade materials and power'
        - '⇨ ⚡ 10,000 J/per'
        - '⇨ ⚡ Stores 8,888,888 J'
    BASIC_ENCHANT_STONE:
      Name: 'Starsteel'
      Lore:
        - 'Starsteel is a rare and mysterious metal'
        - 'This metal does not come from this world'
        - 'It is refined from meteorites that fall to earth'
    WIND_SPIRIT:
      Name: 'Wind Spirit Essence'
      Lore:
        - 'The last pure breath left behind when a Wind Spirit fades away'
        - 'It has no shape, yet carries the spirit of storms and freedom'
        - 'When touched, a faint whisper brushes your fingertips'
        - 'Like howling winds on a distant peak or whispers among the clouds'
        - 'It is key to magic that grants floating, speed, and wind control'
        - ''
        - '“True wind belongs to no one'
        - '   It only returns to this world for a moment through your hands.”'
    WIND_SPIRIT_DROP:
      Name: 'Wind Spirit'
      Lore:
        - 'Dropped when a Wind Spirit is defeated'
        - 'Drop chance: 91.888%'
        - 'The last pure breath left behind when a Wind Spirit fades away'
        - '“True wind belongs to no one'
        - '   It only returns to this world for a moment through your hands.”'
    BASIC_ENCHANT_STONE_DROP:
      Name: 'Flame Zombie'
      Lore:
        - 'Dropped when a Flame Zombie is defeated'
        - 'Drop chance: 91.888%'
        - 'Believe it or not,'
        - 'Starsteel can also drop from Flame Zombies, rare undead creatures reborn through fire and destruction'
        - 'It is mainly obtained by refining certain meteorites'
        - 'but it also has a high chance to drop from Flame Zombies'
        - 'These zombies seem to have been affected by an ancient curse'
        - 'that fused a small amount of Starsteel into their bodies'
    ENCHANTING_TABLE_INFO:
      Name: 'Magic Enchanting Guide'
      Lore:
        - 'You need materials like Starsteel'
        - 'and place your weapon in the matching slot'
        - 'Put the enchantment material in its matching slot'
        - 'Choose the bonus stat you want'
        - 'There are 3 levels'
        - 'Levels 1–3 use 1–3 materials'
        - 'The number of bonus stats you get will vary'
        - 'The amount of material decides how many bonus stats you get'
        - 'Material quality decides the quality of the bonus stats'
    ENCHANTING_TABLE_LIST:
      Name: 'Magic Enchantments'
      Lore:
        - 'Knockback'
        - 'Pull'
        - 'Fire'
        - 'Slow'
        - 'Lightning Strike'
        - 'Power of Creation'
        - 'Ender Pearl Arrow'
        - 'Swap Places on Hit'
        - 'Coming soon'
    FIREZOMBIE_HEAD:
      Name: 'Flame Zombie Head'
      Lore:
        - 'Contains a lot of magical energy'
        - 'Contains a lot of Ender energy'
        - 'It can use magic attacks'
        - 'It can also teleport with Ender magic'
        - 'It can use mind-based attacks'
        - 'It can also attack with its natural fire element'
    FIREZOMBIE_BODY:
      Name: 'Zombie Boss Torso'
      Lore:
        - 'It is both decay and rebirth'

    WIND_ELF_SPAWN:
      Name: 'Wind Spirit'
      Lore:
        - ' '
        - 'Right-click to summon a Wind Spirit'

    WIND_ELF_HEAD:
      Name: 'Wind Spirit Head'
      Lore:
        - 'Contains a lot of magical energy'
        - 'Contains a lot of Ender energy'
        - 'It can use Twin Wind attacks'
        - 'It can also teleport with Ender magic'
        - 'It can use mind-based attacks'
        - 'It can also attack with its natural wind element'
    WIND_ELF_BODY:
      Name: 'Wind Spirit Torso'
      Lore:
        - 'A Wind Spirit torso formed from condensed water'

    WIND_ELF_SKILL:
      Name: 'Wind Spirit Skills'
      Lore:
        - 'Skill use: randomly casts a skill every 4–6 seconds'
        - '1: Magic Attack'
        - 'Deals 10 magic damage to the target'
        - 'Note: Does not ignore armor'
        - '2: Xieyao Wind'
        - 'Randomly picks 2 nearby players and deals 68 or 136 damage to each'
        - 'Note: Does not ignore armor and may target the same player twice'
        - '3: Whirling Wind Attack'
        - 'Deals area damage to players within 15 blocks horizontally and 8 blocks vertically'
        - 'and applies negative effects to them'
    WIND_ELF_DEFENSE:
      Name: 'Wind Elf Defense Guide'
      Lore:
        - 'Healing: Restores 2 health points every second'
        - ''
        - 'Wind Elves are weak against swords'
        - 'Wind Elves take 100% less damage from all other weapons'
        - ''
        - 'A certain amount of yang energy is needed nearby to suppress the Wind Elf'
        - '2–5 players are needed to damage the Wind Elf'
        - ''
        - 'After using a skill, the Wind Elf has a 2–4 second weakness period'
        - 'During this time, its damage resistance drops a lot, and each hit deals no more than 33% damage'
        - ''
        - 'Wind Elves move extremely fast'
        - 'They make a quick dash every 2 seconds'


    PRE_BUILDING_TREE_INFO:
      Name: 'Prebuilt Food · Info'
      Lore:
        - 'You can use it as an item'
        - 'You can also use it as a spawner'
        - 'Each tree has fixed data'
        - 'Only trees spawn from below the center'
        - 'Other structures spawn from the relative origin (0,0,0) toward (+x,+y,+z)'
        - 'Right-click to place the prebuilt structure'
        - 'Shift + right-click to view the structure''s footprint'
    PRE_BUILDING_OAK_TREE:
      Name: 'Prebuilt Tree · Oak Tree'
      Lore:
        - 'This oak tree seed is sealed inside a magical space and holds the life force of an ancient forest'
        - 'Once released, it will quickly grow into a grand oak tree'
        - 'It will bring life and energy to the area around you'
        - 'Hold this magical seed, find a spot you like, aim at any block, and right-click'
        - 'In an instant, a fresh green sprout will push up through the ground'
        - 'It will grow at an amazing speed into a leafy oak tree'
        - 'Whether you want to decorate your builds or expand your home'
        - 'Just one click saves you the time spent planting and waiting for it to grow'
    PRE_BUILDING_SPRUCE_TREE:
      Name: 'Prebuilt Tree · Spruce Tree'
