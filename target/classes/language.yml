        - ''
        - 'Content co-created with players'
        - 'Anyone can take part'
        - 'The final result must be reasonably balanced'



    FISHING_INFO:
      Name: 'Magic Fishing Guide'
      Lore:
        - ''
        - 'Bait priority:'
        - 'Bait placed earlier has higher priority'
        - 'High-priority rule:'
        - 'Off-hand bait is checked first'
        - 'About fishing rods and bait:'
        - 'Only Magic 2.0 series fishing rods trigger special fishing'
        - 'Fishing with or without bait produces different catches'
        - 'Both the fishing rod and bait affect your catch'
        - 'Fishing rod tier affects fish weight and rarity'
        - 'Bait type affects which fish you catch'
        - 'Explore the fishing rod and bait mechanics at your own pace'
        - 'About the materials for the Wind Whisperer''s Rod'
        - 'Stardust Steel Dust, Fish Scale Dust, and Hematite Cores are all obtained from special bait'
        - 'Take your time and enjoy discovering how it works'
        - 'More details may be added if needed; nothing else comes to mind for now'
    FISH_CATEGORY_INFO:
      Name: 'Fish Information Summary'
      Lore:
        - ''
        - 'Fish categories:'
        - '1. Common fish: 2 types'
        - '2. Uncommon fish: 1 type'
        - '3. Rare fish: 21 types'
        - '4. Epic fish: 21 types'
        - '5. Legendary fish: 1 type'
        - '6. Mythical fish: 0 types'

    RANDOM_FISH_COMMON:
      Name: 'Common Fish'
      Lore:
        - ''
        - 'They travel in schools and can be found in almost any body of water'
        - 'They appear along shores, in shallows, and around river mouths'
        - 'They are abundant and make up the most basic fishing catch'
        - 'Cast your line and you will almost always catch a few'

    RANDOM_FISH_UNCOMMON:
      Name: 'Uncommon Fish'
      Lore:
        - ''
        - 'They do not appear in ordinary waters and live only in specific environments'
        - 'They bite only under certain weather conditions or at specific times'
        - 'They are not extraordinarily rare, but they are far from common'
        - 'Only anglers who watch for the right moment have a chance to find them'

    RANDOM_FISH_RARE:
      Name: 'Rare Fish'
      Lore:
        - ''
        - 'They appear only during extreme weather or special lunar phases'
        - 'Their locations are elusive, and they remain for only a short time'
        - 'Many anglers go their whole lives without seeing one'
        - 'Their very existence is a demanding test'

    RANDOM_FISH_RARE_POOL_DUST:
      Name: 'Rare Fish - Ore Dust'
      Lore:
