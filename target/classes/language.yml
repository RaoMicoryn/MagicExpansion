      Lore:
        - 'Put the materials into the Magic Compressor'
        - 'The list of items you can make will show up right away'
        - 'You can forge them quickly'
    QUICK_COMPRESSOR_BV:
      Name: 'Magic Compressor [Placeable]'
      Lore:
        - 'Put the materials into the Magic Compressor'
        - 'The list of items you can make will show up right away'
        - 'You can compress them quickly'
    QUICK_PRESSURE_CHAMBER_BV:
