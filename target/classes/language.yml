    WOOD_ELEMENT:
      Name: 'Wood Element'
      Lore:
        - 'There are five elements in nature'
        - 'They are: Gold, Wood, Water, Fire, and Earth'
        - 'The Wood Element is full of vitality, symbolizing growth and renewal'
        - 'It connects heaven and earth and embodies nature’s life force'
        - 'Legends of the Wood Spirit have been passed down in ancient forests'
        - 'Only those with kindness and patience can hear its whispers'
    GOLD_ELEMENT:
      Name: 'Gold Element'
      Lore:
        - 'There are five elements in nature'
        - 'They are: Gold, Wood, Water, Fire, and Earth'
        - 'The Gold Element is sharp and steadfast, symbolizing strength and order'
        - 'It holds the essence of the earth, forming the bones of mountains and rivers'
        - 'The Gold Spirit sleeps deep within ancient mineral veins'
        - 'Only those with unwavering resolve can awaken its power'
    WATER_ELEMENT:
      Name: 'Water Element'
      Lore:
        - 'There are five elements in nature'
        - 'They are: Gold, Wood, Water, Fire, and Earth'
        - 'The Water Element is gentle and fluid, symbolizing change and acceptance'
        - 'It nourishes all things and is the source of life’s flow'
        - 'Legends of the Water Spirit are told along ancient rivers, lakes, and seas'
        - 'Only those with pure hearts can sense its rhythm'
    FIRE_ELEMENT:
      Name: 'Fire Element'
      Lore:
        - 'There are five elements in nature'
        - 'They are: Gold, Wood, Water, Fire, and Earth'
        - 'The Fire Element is fierce and lively, symbolizing transformation and passion'
        - 'It brings warmth and light, but can also bring destruction'
        - 'The Fire Spirit sleeps deep within ancient volcanoes'
        - 'Only those whose hearts burn with strong determination can wield its power'
    EARTH_ELEMENT:
      Name: 'Earth Element'
      Lore:
        - 'There are five elements in nature'
        - 'They are: Gold, Wood, Water, Fire, and Earth'
        - 'The Earth Element is steady and substantial, symbolizing resilience and support'
        - 'It nurtures all things and is the foundation of life'
        - 'In ancient legends, the Earth Spirit guards the secrets of the land'
        - 'Only those who approach it with reverence can feel its power'

    FIVE_ELEMENT:
      Name: 'Five-Phase Element'
      Lore:
        - 'Combines the five elements'
